name: Rebuild search index

# Статьи пишутся только по-русски. При каждом push с изменёнными страницами
# индекс поиска пересобирается: новые предложения переводятся на беларускую
# мову (остальное берётся из search-index.be.cache.json), результат
# коммитится обратно в main. Коммит сборщика не запускает workflow повторно:
# он меняет только json-файлы, а push от GITHUB_TOKEN событий не порождает.
on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "*.shtml"
      - "build-search-index.py"
  workflow_dispatch: # ручной запуск из вкладки Actions

permissions:
  contents: write

concurrency:
  group: search-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Всегда актуальный main, а не коммит события: если за время ожидания
      # в очереди кто-то запушил ещё, индекс собирается по свежим страницам
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Сбой части переводов не должен терять уже переведённое:
      # индекс всё равно коммитим, а задачу в конце помечаем красной.
      - name: Build search index
        id: build
        continue-on-error: true
        run: python build-search-index.py

      - name: Commit updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # false, если индекс не изменился (коммитить нечего)
          commit_index() {
            git add search-index.json search-index.be.cache.json
            git diff --cached --quiet && return 1
            git commit -q -m "chore: rebuild search index [skip ci]"
          }

          commit_index || { echo "Index is up to date"; exit 0; }

          # Если main успел уйти вперёд, не сливаем два минифицированных JSON
          # (это даёт конфликт), а пересобираем индекс поверх свежего main.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt): main moved, rebuilding on top of it"
            git fetch origin main
            git reset --hard origin/main
            python build-search-index.py || true
            commit_index || { echo "Index is up to date"; exit 0; }
          done
          echo "::error::Could not push the rebuilt index"
          exit 1

      - name: Fail if some segments were not translated
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::Not all segments were translated; re-run the workflow to retry"
          exit 1
